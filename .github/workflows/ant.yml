name: Java CI

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v1
            -   name: Set up JDK 8
                uses: actions/setup-java@v1
                with:
                    java-version: 8
            -   name: run test suite with ant
                run: ant -v -noinput -buildfile build.xml test -DbuildEnv=ci
