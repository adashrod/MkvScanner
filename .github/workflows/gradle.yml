name: Java CI

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK 8
                uses: actions/setup-java@v4
                with:
                    java-version: 8
                    distribution: temurin
            -   name: Run test suite with Gradle
                run: ./gradlew test
